<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Distributed Architecture</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-body: #0a0a0a;
            --bg-card: #111111;
            --text-primary: #f0f0f0;
            --text-secondary: #888888;
            --border-muted: #222222;
            --border-active: #444444;
            --highlight: #ffffff;
            --btn-bg: transparent;
            --btn-hover: #1f1f1f;
            --svg-color: #888888;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-primary);
            margin: 0;
            padding: 40px;
            line-height: 1.5;
        }

        header {
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: -0.5px;
            color: var(--highlight);
            margin: 0;
        }

        .header-sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .grid {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .grid>* {
            flex: 1;
        }

        .panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-muted);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border-muted);
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        svg {
            fill: none;
            stroke: var(--svg-color);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 16px;
            height: 16px;
        }

        .badge {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .log-container {
            height: 300px;
            overflow-y: auto;
            background: transparent;
            font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
        }

        .log-entry {
            border-bottom: 1px solid var(--border-muted);
            padding: 8px 0;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .log-time {
            color: var(--border-active);
            min-width: 90px;
        }

        button {
            background-color: var(--btn-bg);
            color: var(--text-secondary);
            border: 1px solid var(--border-muted);
            padding: 8px 14px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 400;
            transition: all 0.2s ease;
            width: 100%;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            border-color: var(--border-active);
            color: var(--text-primary);
            background-color: var(--bg-body);
        }

        .btn-outline {
            border: 1px solid var(--border-muted);
        }

        .server-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-muted);
        }

        .server-item:last-child {
            border-bottom: none;
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-name {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--highlight);
        }

        .status-online {
            color: var(--text-primary);
        }

        .status-offline {
            color: var(--border-active);
            text-decoration: line-through;
        }

        pre {
            background: transparent;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            margin: 0;
        }

        .consensus-result {
            padding: 12px;
            border: 1px solid var(--border-muted);
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-body);
        }

        .form-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: auto;
        }

        .lead-text {
            color: var(--text-secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--highlight);
            margin-bottom: 24px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Distributed Healthcare Monitoring System</h1>
        <div class="header-sub">Simulation Environment</div>
    </header>

    <div class="grid" style="flex-wrap: wrap;">
        <div class="panel" style="flex: 1; min-width: 300px;">
            <h2>
                <div class="title-group">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="5" />
                        <path d="M3 21v-2a7 7 0 0 1 14 0v2" />
                        <circle cx="19" cy="19" r="2" /></svg>
                    Cluster State
                </div>
                <span class="badge" id="clientCount">
                    0 Nodes
                </span>
            </h2>

            <div class="lead-text">Active Master Node</div>
            <div class="stat-value" id="leader">-</div>

            <button class="btn-outline" onclick="failLeader()">
                <svg viewBox="0 0 24 24">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                    <line x1="12" y1="9" x2="12" y2="13" />
                    <line x1="12" y1="17" x2="12.01" y2="17" /></svg>
                Force Leader Re-election
            </button>

            <div style="margin-top: 24px;">
                <div class="lead-text">Transactions</div>
                <div class="form-actions">
                    <button class="btn-outline" onclick="simulateUpdate('PatientA', 'Client1')">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
                        Mock Req (Client 1)
                    </button>
                    <button class="btn-outline" onclick="simulateUpdate('PatientA', 'Client2')">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></svg>
                        Mock Req (Client 2)
                    </button>
                    <button class="btn-outline" onclick="simulateStressTest('PatientX', 5)">
                        <svg viewBox="0 0 24 24">
                            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" /></svg>
                        Stress Load (5 threads)
                    </button>
                </div>
            </div>
        </div>

        <div class="panel" style="flex: 1.2; min-width: 350px;">
            <h2>
                <div class="title-group">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
                        <line x1="6" y1="6" x2="6.01" y2="6" />
                        <line x1="6" y1="18" x2="6.01" y2="18" /></svg>
                    Region Nodes
                </div>
            </h2>
            <div id="serversList"></div>
            <div class="lead-text" style="margin-top:auto; padding-top:20px;">Quorum Constraint: N > (Active Nodes / 2)</div>
        </div>

        <div class="panel" style="flex: 1; min-width: 300px;">
            <h2>
                <div class="title-group">
                    <svg viewBox="0 0 24 24">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
                    Lock Registry (Queue)
                </div>
            </h2>
            <pre id="locks">{}</pre>
        </div>
    </div>

    <div class="grid" style="flex-wrap: wrap;">
        <div class="panel" style="flex: 2; min-width: 500px;">
            <h2>
                <div class="title-group">
                    <svg viewBox="0 0 24 24">
                        <polyline points="4 17 10 11 4 5" />
                        <line x1="12" y1="19" x2="20" y2="19" /></svg>
                    Telemetry Stream
                </div>
            </h2>
            <div class="log-container" id="systemLogs"></div>
        </div>

        <div class="panel" style="flex: 1; min-width: 300px;">
            <h2>
                <div class="title-group">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" /></svg>
                    Consensus State
                </div>
            </h2>
            <div id="consensusContainer" style="font-size: 0.8rem; height: 300px; overflow-y: auto;">
                <p style="color: var(--text-secondary); font-family: monospace;">Awaiting quorum phase...</p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Request connection specifically as a Dashboard monitoring role
        const socket = io({
            query: {
                role: "Dashboard"
            }
        });

        const leaderEl = document.getElementById("leader");
        const locksEl = document.getElementById("locks");
        const serversListEl = document.getElementById("serversList");
        const logsEl = document.getElementById("systemLogs");
        const clientCountEl = document.getElementById("clientCount");
        const consensusEl = document.getElementById("consensusContainer");

        // Format times
        const timeStr = (iso) => {
            const date = new Date(iso);
            return `${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}:${date.getSeconds().toString().padStart(2, '0')}.${date.getMilliseconds().toString().padStart(3, '0')}`;
        };

        // 1. Connection Event
        socket.on("clientCount", (count) => {
            clientCountEl.innerText = `Nodes: ${count}`;
        });

        // 2. State Updates
        socket.on("update", (data) => {
            leaderEl.innerText = data.leader;
            locksEl.innerText = Object.keys(data.locks).length > 0 ?
                JSON.stringify(data.locks, null, 2) :
                "Queue is empty.";

            renderServers(data.servers);
        });

        // 3. System Logs
        socket.on("systemLog", (log) => {
            const entry = document.createElement("div");
            entry.className = "log-entry";

            // Minimal bolding for logs
            let msg = log.message.replace(/\[/g, '[').replace(/\]/g, ']');

            entry.innerHTML = `<span class="log-time">${timeStr(log.timestamp)}</span> <span style="flex:1;">${msg}</span>`;
            logsEl.insertBefore(entry, logsEl.firstChild);

            if (logsEl.children.length > 100) {
                logsEl.removeChild(logsEl.lastChild);
            }
        });

        // 4. Consensus Voting
        socket.on("consensusResult", (data) => {
            const statusText = data.hasMajority ? 'VERIFIED' : 'ABORTED';
            const colorStatus = data.hasMajority ? 'var(--text-primary)' : 'var(--border-active)';

            let html = `
                <div class="consensus-result">
                    <div style="margin-bottom: 8px; color: ${colorStatus}">
                        REF: ${data.patientId} | REQ: ${data.client}<br>
                        QUORUM: ${statusText} [${data.votes}/${data.total}]
                    </div>
            `;

            data.details.forEach(res => {
                const icon = res.vote ? '+ ACK' : `- NAK (${res.reason || 'OFFLINE'})`;
                html += `<div style="color: var(--text-secondary); margin-bottom: 2px;">${res.server.padEnd(10, ' ')} : ${icon}</div>`;
            });

            html += `</div>`;
            consensusEl.innerHTML = html;
        });

        // --- Render Helpers ---

        function renderServers(servers) {
            serversListEl.innerHTML = "";
            servers.forEach(s => {
                const statusClass = s.isOnline ? 'status-online' : 'status-offline';
                const statusText = s.isOnline ? 'Active' : 'Offline';
                const btnAction = s.isOnline ?
                    `<button class="btn-outline" style="width: auto; padding: 4px 10px; font-size:0.75rem;" onclick="failRegion('${s.name}')">Isolate</button>` :
                    `<button class="btn-outline" style="width: auto; padding: 4px 10px; font-size:0.75rem;" onclick="recoverRegion('${s.name}')">Restore</button>`;

                serversListEl.innerHTML += `
                    <div class="server-item">
                        <div class="server-info">
                            <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                            <span class="server-name ${statusClass}">${s.name} <span style="font-weight: 300; font-size: 0.75rem; color: var(--text-secondary); margin-left:8px;">${statusText}</span></span>
                        </div>
                        <div>${btnAction}</div>
                    </div>
                `;
            });
        }

        // --- API Calls ---

        function failLeader() {
            fetch("/failLeader");
        }

        function failRegion(name) {
            fetch(`/failRegion/${name}`);
        }

        function recoverRegion(name) {
            fetch(`/recoverRegion/${name}`);
        }

        function simulateUpdate(patient, client) {
            fetch(`/update/${patient}/${client}`);
        }

        function simulateStressTest(patient, clients) {
            logsEl.innerHTML += `<div class="log-entry"><span class="log-time">${timeStr(new Date())}</span> <strong>[SYS]</strong> Initiating ${clients} concurrent mutual exclusion requests...</div>`;
            fetch(`/stress/${patient}/${clients}`);
        }
    </script>
</body>

</html>
